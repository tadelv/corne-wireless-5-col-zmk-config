# Uncomment the following line to enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

CONFIG_ZMK_KEYBOARD_NAME="Chocofi"

# Add mouse capability
CONFIG_ZMK_POINTING=y

# KeyBeacon — layer/mods/connectivity/battery over the host BLE link (KBP 1.2).
# Left half is central (ZMK default for corne_left), so the module links there;
# the right half compiles it out via the module's own cmake guard.
CONFIG_ZMK_KEYBEACON=y
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=y
CONFIG_ZMK_KEYBEACON_BATTERY=y
CONFIG_ZMK_KEYBEACON_HOST_LINK=y

# Let the central read the peripheral half's battery level, so the KeyBeacon
# Battery characteristic can report both halves. ZMK default is n.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
